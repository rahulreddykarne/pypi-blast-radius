[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypi-blast-radius"
version = "0.1.0"
description = "Estimate the downstream impact ('blast radius') of a PyPI package version from deps.dev dependent counts and download volume."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "krc7169", email = "krc7169@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.20"]

[project.urls]
Homepage = "https://github.com/rahulreddykarne/pypi-blast-radius"
Repository = "https://github.com/rahulreddykarne/pypi-blast-radius"
Issues = "https://github.com/rahulreddykarne/pypi-blast-radius/issues"
Changelog = "https://github.com/rahulreddykarne/pypi-blast-radius/releases"

[project.scripts]
pypi-blast-radius = "pypi_blast_radius.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/pypi_blast_radius"]

[tool.hatch.build.targets.sdist]
include = ["src/pypi_blast_radius", "README.md", "LICENSE", "tests"]
